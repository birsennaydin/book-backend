name: Backend CI
on:
  push:
    branches: [main, develop]
    paths: ['**/*.php','composer.*','routes/**','database/**','resources/**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_PASSWORD: pass, POSTGRES_DB: book_test, POSTGRES_USER: postgres }
        ports: ['5432:5432']
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: mbstring, intl, pdo_pgsql, redis }
      - run: composer install --prefer-dist --no-interaction
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan migrate --force
      - run: php artisan test --colors=always
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy (staging/prod)
        run: |
          echo "Trigger deploy via SSH/Forge/Vapor/Deployer here"
          # örn: ssh deploy@server "./deploy-backend.sh ${{ github.ref_name }}"
